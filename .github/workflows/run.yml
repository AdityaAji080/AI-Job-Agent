name: Job search run

on:
  schedule:
    # 01:17 UTC = 06:47 IST, every day. Daily runs with a small quota reach postings
    # within a day of going up, when applying early counts most.
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = harvest + agent; harvest-only = check boards, no model calls"
        type: choice
        options: [full, harvest-only]
        default: full

concurrency:
  group: job-agent
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      # LaTeX for the tailored-CV tests (they skip without it, but CI should run them).
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends
             texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  run:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JOBAGENT_HOME: private
    steps:
      - uses: actions/checkout@v4

      # Your resume, criteria and tracker live in a separate private repository so
      # this one can be public. Set the repository variable DATA_REPO (owner/name)
      # and the secret DATA_REPO_TOKEN (fine-grained token, Contents: read & write).
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: private

      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: Harvest boards only
        if: github.event.inputs.mode == 'harvest-only'
        run: python -m jobagent.agent --dry-run

      - name: Run the agent
        if: github.event.inputs.mode != 'harvest-only'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_BUDGET_USD: ${{ vars.MAX_BUDGET_USD || '2.00' }}
          MAX_NEW_JOBS: ${{ vars.MAX_NEW_JOBS || '6' }}
          MAX_US_JOBS: ${{ vars.MAX_US_JOBS || '1' }}
          MAX_PER_COMPANY: ${{ vars.MAX_PER_COMPANY || '1' }}
          COMPANY_COOLDOWN_DAYS: ${{ vars.COMPANY_COOLDOWN_DAYS || '14' }}
          LARGE_EMPLOYER_POSTINGS: ${{ vars.LARGE_EMPLOYER_POSTINGS || '150' }}
          CROWDED_APPLICANTS: ${{ vars.CROWDED_APPLICANTS || '100' }}
          MAX_CROWDED_PER_RUN: ${{ vars.MAX_CROWDED_PER_RUN || '2' }}
          MARKET_SHARES: ${{ vars.MARKET_SHARES || '' }}
          MARKET_RELEASE_AFTER: ${{ vars.MARKET_RELEASE_AFTER || '15' }}
          JOBAGENT_MODEL: ${{ vars.JOBAGENT_MODEL || 'sonnet' }}
        run: python -m jobagent.agent

      - name: Save results to the data repository
        if: always() && github.event.inputs.mode != 'harvest-only'
        working-directory: private
        run: |
          git config user.name "job-agent"
          git config user.email "job-agent@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Job search run $(date -u +%Y-%m-%d)"
            # Take in tracker edits pushed while the run was going (marking jobs applied).
            git pull --rebase
            git push
          fi

  # CVs for the jobs just recorded (and any backlog), through the Batch API at half price.
  # Batches usually finish within the hour; one still running at the time limit is
  # collected by the next run, so nothing is lost or paid for twice.
  # It still runs when the search step fails (a backlog is worth tailoring), but never
  # when the tests failed: !cancelled() alone would let untested code spend money.
  tailor:
    needs: [tests, run]
    if: ${{ !cancelled() && needs.tests.result == 'success' && github.event.inputs.mode != 'harvest-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      JOBAGENT_HOME: private
    steps:
      - uses: actions/checkout@v4

      # Checked out after the search job has pushed, so it sees the jobs just recorded.
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: private

      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }

      - name: Install LaTeX
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends
             texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

      - run: pip install -r requirements.txt

      - name: Tailor CVs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_TAILOR: ${{ vars.MAX_TAILOR || '40' }}
          COVER_LETTERS: ${{ vars.COVER_LETTERS || 'when_required' }}
        run: python -m jobagent.cv batch --max "$MAX_TAILOR" --deadline-minutes 300

      - name: Save to the data repository
        if: always()
        working-directory: private
        run: |
          git config user.name "job-agent"
          git config user.email "job-agent@users.noreply.github.com"
          # Take in any tracker edits made while the batch ran, then add the CV paths on top.
          git pull --rebase --autostash
          (cd .. && python -m jobagent.cv apply-updates)
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Tailored CVs $(date -u +%Y-%m-%d)"
            git push
          fi
