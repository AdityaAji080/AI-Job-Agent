name: Job search run

on:
  schedule:
    # 01:17 UTC = 06:47 IST, Monday / Wednesday / Friday.
    - cron: "17 1 * * 1,3,5"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = harvest + agent; harvest-only = check boards, no model calls"
        type: choice
        options: [full, harvest-only]
        default: full

concurrency:
  group: job-agent
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  run:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JOBAGENT_HOME: private
    steps:
      - uses: actions/checkout@v4

      # Your resume, criteria and tracker live in a separate private repository so
      # this one can be public. Set the repository variable DATA_REPO (owner/name)
      # and the secret DATA_REPO_TOKEN (fine-grained token, Contents: read & write).
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: private

      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: Harvest boards only
        if: github.event.inputs.mode == 'harvest-only'
        run: python -m jobagent.agent --dry-run

      - name: Run the agent
        if: github.event.inputs.mode != 'harvest-only'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_BUDGET_USD: ${{ vars.MAX_BUDGET_USD || '5.00' }}
          MAX_NEW_JOBS: ${{ vars.MAX_NEW_JOBS || '25' }}
        run: python -m jobagent.agent

      - name: Save results to the data repository
        if: always() && github.event.inputs.mode != 'harvest-only'
        working-directory: private
        run: |
          git config user.name "job-agent"
          git config user.email "job-agent@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Job search run $(date -u +%Y-%m-%d)"
            git push
          fi
