name: Tailor CVs

# Run by hand: Actions -> Tailor CVs -> Run workflow.
#   With URLs: tailors just those postings now, at standard prices (a few minutes). Tick
#              "letter" for a cover letter even where the posting doesn't ask for one.
#   Without:   works through every tracked job that has no CV yet, newest first, through
#              the Batch API at half price (usually within the hour). Use it to catch up.
# CVs are committed to the private data repository only. This repository is public, and
# anything attached to a run here (artifacts) can be downloaded by any GitHub user.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Posting URLs, separated by spaces. Leave empty to tailor the backlog."
        required: false
        default: ""
      max:
        description: "Backlog only: most jobs to take on in this run"
        required: false
        default: "150"
      letter:
        description: "With URLs: write a cover letter even if the posting doesn't ask for one"
        type: boolean
        default: false

# Shares the search run's group, so the two never push to the data repo at the same time.
concurrency:
  group: job-agent
  cancel-in-progress: false

jobs:
  tailor:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      JOBAGENT_HOME: private
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: private

      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }

      - name: Install LaTeX
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends
             texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

      - run: pip install -r requirements.txt

      - name: Tailor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Passed through the environment, never pasted into the script, so input can't
          # inject shell commands.
          URLS: ${{ inputs.urls }}
          MAX: ${{ inputs.max }}
          LETTER: ${{ inputs.letter }}
        run: |
          set -f  # no filename expansion of the URLs
          if [ -n "$URLS" ]; then
            if [ "$LETTER" = "true" ]; then
              python -m jobagent.cv tailor --letter $URLS
            else
              python -m jobagent.cv tailor $URLS
            fi
          else
            python -m jobagent.cv batch --max "$MAX" --deadline-minutes 300
          fi

      - name: Save to the data repository
        if: always()
        working-directory: private
        run: |
          git config user.name "job-agent"
          git config user.email "job-agent@users.noreply.github.com"
          # Take in any tracker edits made during the run, then add the CV paths on top.
          git pull --rebase --autostash
          (cd .. && python -m jobagent.cv apply-updates)
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Tailored CVs $(date -u +%Y-%m-%d)"
            git push
          fi
